<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Emulator RemoteApp - Управление операторами</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .main-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: none;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
        }
        
        .btn-success {
            background: linear-gradient(45deg, #56ab2f, #a8e6cf);
            border: none;
        }
        
        .btn-info {
            background: linear-gradient(45deg, #3498db, #2980b9);
            border: none;
        }
        
        .operator-card {
            border-left: 4px solid #667eea;
            transition: transform 0.2s;
        }
        
        .operator-card:hover {
            transform: translateY(-2px);
        }
        
        .emulator-card {
            border-left: 4px solid #56ab2f;
        }
        
        .hidden {
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
        }
        
        .status-badge {
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- Навигационная панель -->
        <nav class="navbar navbar-expand-lg navbar-dark" style="background: rgba(0,0,0,0.1);">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <i class="fas fa-mobile-alt me-2"></i>
                    Android Emulator RemoteApp
                </a>
                <div class="navbar-nav ms-auto">
                    <span class="navbar-text me-3" id="userInfo"></span>
                    <button class="btn btn-outline-light btn-sm" onclick="logout()" id="logoutBtn" style="display: none;">
                        <i class="fas fa-sign-out-alt"></i> Выход
                    </button>
                </div>
            </div>
        </nav>

        <!-- Основной контент -->
        <div class="container mt-4">
            <!-- Форма входа администратора -->
            <div id="adminLoginForm" class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header text-center">
                            <h4><i class="fas fa-user-shield me-2"></i>Вход администратора</h4>
                        </div>
                        <div class="card-body">
                            <form onsubmit="adminLogin(event)">
                                <div class="mb-3">
                                    <label class="form-label">Логин</label>
                                    <input type="text" class="form-control" id="adminUsername" value="admin" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Пароль</label>
                                    <input type="password" class="form-control" id="adminPassword" value="admin123" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="fas fa-sign-in-alt me-2"></i>Войти
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Панель администратора -->
            <div id="adminPanel" class="hidden">
                <div class="row mb-4">
                    <div class="col">
                        <h2><i class="fas fa-users me-2"></i>Управление операторами</h2>
                        <button class="btn btn-success" onclick="createOperator()">
                            <i class="fas fa-user-plus me-2"></i>Создать оператора
                        </button>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col">
                        <div id="operatorsList"></div>
                    </div>
                </div>
            </div>

            <!-- Форма входа оператора -->
            <div id="operatorLoginForm" class="row justify-content-center hidden">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header text-center">
                            <h4><i class="fas fa-user me-2"></i>Вход оператора</h4>
                        </div>
                        <div class="card-body">
                            <form onsubmit="operatorLogin(event)">
                                <div class="mb-3">
                                    <label class="form-label">Логин</label>
                                    <input type="text" class="form-control" id="operatorUsername" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Пароль</label>
                                    <input type="password" class="form-control" id="operatorPassword" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="fas fa-sign-in-alt me-2"></i>Войти
                                </button>
                            </form>
                            <div class="text-center mt-3">
                                <button class="btn btn-link" onclick="showAdminLogin()">
                                    Вход администратора
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Панель оператора -->
            <div id="operatorPanel" class="hidden">
                <div class="row mb-4">
                    <div class="col">
                        <h2><i class="fas fa-mobile-alt me-2"></i>Мои эмуляторы</h2>
                        <button class="btn btn-success" onclick="createEmulator()">
                            <i class="fas fa-plus me-2"></i>Создать эмулятор
                        </button>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col">
                        <div id="emulatorsList"></div>
                    </div>
                </div>
            </div>

            <!-- Модальное окно создания эмулятора -->
            <div class="modal fade" id="createEmulatorModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Создать новый эмулятор</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <form id="createEmulatorForm">
                                <div class="mb-3">
                                    <label class="form-label">Название эмулятора</label>
                                    <input type="text" class="form-control" id="emulatorName" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Тип устройства</label>
                                    <select class="form-select" id="deviceType">
                                        <option value="small_phone">Small Phone</option>
                                        <option value="pixel_6">Pixel 6</option>
                                        <option value="tablet">Tablet</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">API Level</label>
                                    <select class="form-select" id="apiLevel">
                                        <option value="android-36">Android 36 (API 36)</option>
                                        <option value="android-34">Android 34 (API 34)</option>
                                        <option value="android-33">Android 33 (API 33)</option>
                                    </select>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                            <button type="button" class="btn btn-primary" onclick="submitCreateEmulator()">
                                <i class="fas fa-plus me-2"></i>Создать
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Модальное окно прогресса -->
            <div class="modal fade" id="progressModal" tabindex="-1" data-bs-backdrop="static">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="progressTitle">Выполнение операции...</h5>
                        </div>
                        <div class="modal-body">
                            <div class="progress mb-3">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" 
                                     id="progressBar" style="width: 0%"></div>
                            </div>
                            <div id="progressLog" style="max-height: 300px; overflow-y: auto; background: #f8f9fa; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 0.9em;"></div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" id="progressCloseBtn" 
                                    onclick="closeProgressModal()" style="display: none;">Закрыть</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentToken = null;
        let currentUserType = null;
        let progressModal = null;
        let createEmulatorModal = null;

        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            progressModal = new bootstrap.Modal(document.getElementById('progressModal'));
            createEmulatorModal = new bootstrap.Modal(document.getElementById('createEmulatorModal'));
            
            // Проверяем сохраненный токен
            const savedToken = localStorage.getItem('token');
            const savedUserType = localStorage.getItem('userType');
            if (savedToken && savedUserType) {
                currentToken = savedToken;
                currentUserType = savedUserType;
                if (savedUserType === 'admin') {
                    showAdminPanel();
                } else {
                    showOperatorPanel();
                }
            }
        });

        // Вход администратора
        async function adminLogin(event) {
            event.preventDefault();
            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (data.success) {
                    currentToken = data.token;
                    currentUserType = 'admin';
                    localStorage.setItem('token', currentToken);
                    localStorage.setItem('userType', currentUserType);
                    showAdminPanel();
                } else {
                    alert('Ошибка входа: ' + data.error);
                }
            } catch (error) {
                alert('Ошибка подключения: ' + error.message);
            }
        }

        // Вход оператора
        async function operatorLogin(event) {
            event.preventDefault();
            const username = document.getElementById('operatorUsername').value;
            const password = document.getElementById('operatorPassword').value;

            try {
                const response = await fetch('/api/operator_login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (data.success) {
                    currentToken = data.token;
                    currentUserType = 'operator';
                    localStorage.setItem('token', currentToken);
                    localStorage.setItem('userType', currentUserType);
                    showOperatorPanel();
                } else {
                    alert('Ошибка входа: ' + data.error);
                }
            } catch (error) {
                alert('Ошибка подключения: ' + error.message);
            }
        }

        // Показать панель администратора
        function showAdminPanel() {
            document.getElementById('adminLoginForm').classList.add('hidden');
            document.getElementById('operatorLoginForm').classList.add('hidden');
            document.getElementById('operatorPanel').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            document.getElementById('logoutBtn').style.display = 'block';
            document.getElementById('userInfo').textContent = 'Администратор';
            loadOperators();
        }

        // Показать панель оператора
        function showOperatorPanel() {
            document.getElementById('adminLoginForm').classList.add('hidden');
            document.getElementById('operatorLoginForm').classList.add('hidden');
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('operatorPanel').classList.remove('hidden');
            document.getElementById('logoutBtn').style.display = 'block';
            document.getElementById('userInfo').textContent = 'Оператор';
            loadOperatorEmulators();
        }

        // Показать форму входа администратора
        function showAdminLogin() {
            document.getElementById('operatorLoginForm').classList.add('hidden');
            document.getElementById('adminLoginForm').classList.remove('hidden');
        }

        // Показать форму входа оператора
        function showOperatorLogin() {
            document.getElementById('adminLoginForm').classList.add('hidden');
            document.getElementById('operatorLoginForm').classList.remove('hidden');
        }

        // Выход
        function logout() {
            currentToken = null;
            currentUserType = null;
            localStorage.removeItem('token');
            localStorage.removeItem('userType');
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('operatorPanel').classList.add('hidden');
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('userInfo').textContent = '';
            showOperatorLogin();
        }

        // Создание оператора
        async function createOperator() {
            showProgress('Создание оператора', 'Создание пользователя Windows и инициализация SDK...');
            
            try {
                const response = await fetch('/api/create_operator', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                updateProgress(100, data.success ? 'Оператор создан успешно!' : 'Ошибка создания оператора');
                
                if (data.success) {
                    appendProgressLog(`✅ Оператор создан: ${data.operator.username}`);
                    appendProgressLog(`🔑 Пароль: ${data.operator.password}`);
                    setTimeout(() => {
                        closeProgressModal();
                        loadOperators();
                    }, 2000);
                } else {
                    appendProgressLog(`❌ Ошибка: ${data.error}`);
                    showProgressCloseButton();
                }
            } catch (error) {
                updateProgress(0, 'Ошибка подключения');
                appendProgressLog(`❌ Ошибка: ${error.message}`);
                showProgressCloseButton();
            }
        }

        // Загрузка списка операторов
        async function loadOperators() {
            try {
                const response = await fetch('/api/operators', {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });

                const data = await response.json();
                if (data.success) {
                    displayOperators(data.operators);
                }
            } catch (error) {
                console.error('Ошибка загрузки операторов:', error);
            }
        }

        // Отображение операторов
        function displayOperators(operators) {
            const container = document.getElementById('operatorsList');
            if (operators.length === 0) {
                container.innerHTML = '<div class="alert alert-info">Операторы не найдены. Создайте первого оператора.</div>';
                return;
            }

            container.innerHTML = operators.map(operator => `
                <div class="card operator-card mb-3">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-8">
                                <h5 class="card-title">
                                    <i class="fas fa-user me-2"></i>${operator.username}
                                    <span class="badge bg-success status-badge ms-2">${operator.status}</span>
                                </h5>
                                <p class="card-text">
                                    <small class="text-muted">
                                        <i class="fas fa-calendar me-1"></i>Создан: ${new Date(operator.created_at).toLocaleString()}
                                        <br>
                                        <i class="fas fa-mobile-alt me-1"></i>Эмуляторов: ${operator.emulator_count}
                                    </small>
                                </p>
                            </div>
                            <div class="col-md-4 text-end">
                                <div class="mb-2">
                                    <strong>Пароль:</strong> <code>${operator.password}</code>
                                </div>
                                <button class="btn btn-info btn-sm" onclick="loginAsOperator('${operator.username}', '${operator.password}')">
                                    <i class="fas fa-sign-in-alt me-1"></i>Войти как оператор
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Вход как оператор
        function loginAsOperator(username, password) {
            document.getElementById('operatorUsername').value = username;
            document.getElementById('operatorPassword').value = password;
            showOperatorLogin();
        }

        // Создание эмулятора
        function createEmulator() {
            createEmulatorModal.show();
        }

        // Отправка формы создания эмулятора
        async function submitCreateEmulator() {
            const name = document.getElementById('emulatorName').value;
            const device = document.getElementById('deviceType').value;
            const apiLevel = document.getElementById('apiLevel').value;

            createEmulatorModal.hide();
            showProgress('Создание эмулятора', 'Создание AVD, batch файла, EXE и настройка RemoteApp...');

            try {
                const response = await fetch('/api/create_emulator', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, device, api_level: apiLevel })
                });

                const data = await response.json();
                updateProgress(100, data.success ? 'Эмулятор создан успешно!' : 'Ошибка создания эмулятора');
                
                if (data.success) {
                    appendProgressLog(`✅ Эмулятор создан: ${data.emulator.name}`);
                    appendProgressLog(`📱 Устройство: ${data.emulator.device}`);
                    appendProgressLog(`🎯 API Level: ${data.emulator.api_level}`);
                    setTimeout(() => {
                        closeProgressModal();
                        loadOperatorEmulators();
                    }, 2000);
                } else {
                    appendProgressLog(`❌ Ошибка: ${data.error}`);
                    showProgressCloseButton();
                }
            } catch (error) {
                updateProgress(0, 'Ошибка подключения');
                appendProgressLog(`❌ Ошибка: ${error.message}`);
                showProgressCloseButton();
            }
        }

        // Загрузка эмуляторов оператора
        async function loadOperatorEmulators() {
            try {
                const response = await fetch('/api/operator_emulators', {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });

                const data = await response.json();
                if (data.success) {
                    displayEmulators(data.emulators);
                }
            } catch (error) {
                console.error('Ошибка загрузки эмуляторов:', error);
            }
        }

        // Отображение эмуляторов
        function displayEmulators(emulators) {
            const container = document.getElementById('emulatorsList');
            if (emulators.length === 0) {
                container.innerHTML = '<div class="alert alert-info">Эмуляторы не найдены. Создайте первый эмулятор.</div>';
                return;
            }

            container.innerHTML = emulators.map(emulator => `
                <div class="card emulator-card mb-3">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-8">
                                <h5 class="card-title">
                                    <i class="fas fa-mobile-alt me-2"></i>${emulator.name}
                                    <span class="badge bg-success status-badge ms-2">${emulator.status}</span>
                                </h5>
                                <p class="card-text">
                                    <small class="text-muted">
                                        <i class="fas fa-microchip me-1"></i>Устройство: ${emulator.device}
                                        <br>
                                        <i class="fas fa-code me-1"></i>API Level: ${emulator.api_level}
                                        <br>
                                        <i class="fas fa-calendar me-1"></i>Создан: ${new Date(emulator.created_at).toLocaleString()}
                                    </small>
                                </p>
                            </div>
                            <div class="col-md-4 text-end">
                                <button class="btn btn-primary btn-sm mb-2" onclick="downloadRDP('${emulator.id}', '${emulator.name}')">
                                    <i class="fas fa-download me-1"></i>Скачать RDP
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Скачивание RDP файла
        async function downloadRDP(emulatorId, emulatorName) {
            try {
                const response = await fetch(`/api/download_rdp/${emulatorId}`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${emulatorName}.rdp`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                } else {
                    const data = await response.json();
                    alert('Ошибка скачивания: ' + data.error);
                }
            } catch (error) {
                alert('Ошибка скачивания: ' + error.message);
            }
        }

        // Функции прогресса
        function showProgress(title, message) {
            document.getElementById('progressTitle').textContent = title;
            document.getElementById('progressLog').innerHTML = message;
            document.getElementById('progressBar').style.width = '10%';
            document.getElementById('progressCloseBtn').style.display = 'none';
            progressModal.show();
        }

        function updateProgress(percent, message) {
            document.getElementById('progressBar').style.width = percent + '%';
            if (message) {
                appendProgressLog(message);
            }
        }

        function appendProgressLog(message) {
            const log = document.getElementById('progressLog');
            log.innerHTML += '<br>' + message;
            log.scrollTop = log.scrollHeight;
        }

        function showProgressCloseButton() {
            document.getElementById('progressCloseBtn').style.display = 'block';
        }

        function closeProgressModal() {
            progressModal.hide();
        }

        // Показываем форму входа оператора по умолчанию
        if (!currentToken) {
            showOperatorLogin();
        }
    </script>
  </body>
  </html>
