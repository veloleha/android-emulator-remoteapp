<!DOCTYPE html>
<html>
<head>
    <title>Тест Flask</title>
    <meta charset="utf-8">
</head>
<body>
    <h1>🎉 Flask работает корректно!</h1>
    <p>Сайт успешно запущен из папки web</p>
    <p>Время: <span id="time"></span></p>
    <script>
        document.getElementById('time').textContent = new Date().toLocaleString();
    </script>
</body>
</html>
