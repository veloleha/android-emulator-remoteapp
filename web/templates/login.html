{% extends "base.html" %}

{% block title %}Вход в систему - Android Emulator Manager{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 5rem auto;">
    <div class="header">
        <h1>🔐 Вход в систему</h1>
        <p>Система управления Android эмуляторами</p>
    </div>
    
    <form method="post" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" name="username" required>
        </div>
        
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" required>
        </div>
        
        <button type="submit" class="btn" style="width: 100%;">
            Войти в систему
        </button>
    </form>
    
    <div style="margin-top: 2rem; padding: 1rem; background: #f8f9fa; border-radius: 5px; font-size: 0.9rem; color: #666;">
        <strong>Тестовые данные:</strong><br>
        Логин: admin<br>
        Пароль: admin123
        <br><br>
        <em>⚠️ Обязательно измените пароль в продакшене!</em>
    </div>
</div>
{% endblock %}
